services:
  mongodb:
    image: mongo:7.0
    container_name: edutt-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - edutt_mongo_data:/data/db
      - ./backups:/backups
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 10s

volumes:
  edutt_mongo_data:
    name: edutt_mongo_data
